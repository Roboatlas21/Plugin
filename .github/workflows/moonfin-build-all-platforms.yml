name: Moonfin v2 Android APKs and tests (Plugin relay)

# Runs on the Plugin fork because Actions are unavailable in the Core fork.
# Both repositories are pinned so the build cannot silently switch to newer code.
on:
  push:
    branches: [ci/moonfin-live-tv-groups]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  CORE_SHA: '421f9b25c4441cbf28f90b27552b71b1f07715dd'
  PLUGIN_SHA: 'ae79e2ee744c23b187f47d873db1a65e62f11551'

jobs:
  android:
    name: Android ${{ matrix.target }} APK
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile
            artifact: moonfin-v2-android-mobile
            files: Moonfin_Android_v*.apk
          - target: tv
            artifact: moonfin-v2-android-tv
            files: Moonfin_AndroidTV_v*.apk
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Roboatlas21/Moonfin-Core
          ref: 421f9b25c4441cbf28f90b27552b71b1f07715dd
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$CORE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Limit Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2G
          EOF
      - name: Build Android APK and app bundle
        run: |
          chmod +x build-android.sh
          ./build-android.sh ${{ matrix.target }}
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Roboatlas21/Moonfin-Core
          ref: 421f9b25c4441cbf28f90b27552b71b1f07715dd
          persist-credentials: false
      - name: Verify source commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CORE_SHA) {
            throw "Unexpected Moonfin-Core commit"
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Find vcpkg and runner image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Build Windows installer
        shell: pwsh
        run: .\build-windows.ps1
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Filter 'Moonfin_Windows_v*.exe' -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "Windows installer not found" }
          $files | ForEach-Object { Write-Host "Built $($_.Name)" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: moonfin-v2-windows-x64-installer
          path: Moonfin_Windows_v*.exe
          if-no-files-found: error
          retention-days: 7

  app-tests:
    name: Flutter app tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Roboatlas21/Moonfin-Core
          ref: 421f9b25c4441cbf28f90b27552b71b1f07715dd
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$CORE_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Run full app test shard
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort | awk -v shard="${{ matrix.shard }}" '(NR - 1) % 3 == shard')
          echo "Running ${#files[@]} Dart test files on shard ${{ matrix.shard }}"
          flutter test "${files[@]}" --reporter expanded 2>&1 | tee "app-tests-${{ matrix.shard }}.log"
      - name: Save test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-tests-shard-${{ matrix.shard }}-log
          path: app-tests-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7

  package-tests:
    name: Flutter package tests
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Roboatlas21/Moonfin-Core
          ref: 421f9b25c4441cbf28f90b27552b71b1f07715dd
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$CORE_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Run package tests
        shell: bash
        run: |
          set -uo pipefail
          flutter pub get
          status=0
          packages="custom_tv_text_field_fork design rar_fork server_core server_emby server_jellyfin server_plex playback_plex server_silo playback_silo"
          for pkg in $packages; do
            echo "=== $pkg ==="
            (cd "packages/$pkg" && flutter pub get && flutter test --reporter expanded) 2>&1 | tee -a package-tests.log || status=1
          done
          exit "$status"
      - name: Save package test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-tests-log
          path: package-tests.log
          if-no-files-found: ignore
          retention-days: 7

  moonbase-tests:
    name: Moonbase Jellyfin and Emby tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Roboatlas21/Plugin
          ref: ae79e2ee744c23b187f47d873db1a65e62f11551
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$PLUGIN_SHA"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test Jellyfin plugin
        run: dotnet test Jellyfin/tests/Moonfin.Server.Tests/Moonfin.Server.Tests.csproj -c Release
      - name: Test Emby plugin
        run: dotnet test Emby/tests/Emby.Plugins.Moonfin.Tests/Emby.Plugins.Moonfin.Tests.csproj -c Release
      - name: Run salvage tests
        run: dotnet run --project Jellyfin/tools/salvage-tests -c Release
