name: Verify Moonfin v3 EPG search and guide regressions

on:
  push:
    branches: [ci/moonfin-v3-epg-search-20261113]

permissions:
  contents: read

jobs:
  regression:
    name: Moonfin v3 EPG search and guide regressions
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Roboatlas21/Moonfin-Core
          ref: 72c16187441447ae3bc6816d303e94f2de0becad
          persist-credentials: false
      - name: Verify pinned commit
        run: test "$(git rev-parse HEAD)" = "72c16187441447ae3bc6816d303e94f2de0becad"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Verify Dart formatting
        id: format
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/ui/screens/livetv/live_tv_guide_screen.dart \
            lib/ui/screens/livetv/guide/guide_filter_picker.dart \
            lib/ui/screens/livetv/guide/guide_program_search_dialog.dart \
            lib/ui/widgets/local_search_field.dart \
            test/livetv/guide_navigation_widget_test.dart \
            test/livetv/guide_program_search_test.dart \
            packages/server_emby/test/emby_live_tv_channel_groups_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test TV picker focus
        id: picker
        continue-on-error: true
        run: flutter test test/livetv/guide_navigation_widget_test.dart --reporter expanded
      - name: Test EPG search
        id: epg
        continue-on-error: true
        run: flutter test test/livetv/guide_program_search_test.dart --reporter expanded
      - name: Test compact landscape guide
        id: layout
        continue-on-error: true
        run: |
          flutter test test/livetv/guide_layout_arrangement_widget_test.dart \
            --plain-name 'compact landscape chrome leaves five full guide rows visible' \
            --reporter expanded
      - name: Test Emby malformed response
        id: emby
        continue-on-error: true
        run: |
          cd packages/server_emby
          flutter pub get
          flutter test test/emby_live_tv_channel_groups_test.dart --reporter expanded
      - name: Require all checks to pass
        if: always()
        run: |
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.picker.outcome }}" = success
          test "${{ steps.epg.outcome }}" = success
          test "${{ steps.layout.outcome }}" = success
          test "${{ steps.emby.outcome }}" = success
